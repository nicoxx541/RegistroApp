<ion-content class="ion-padding registro-container">
  <div class="header">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <h1 class="title">¡REGÍSTRATE!</h1>
  </div>

  <div class="form-container">
    <ion-item>
      <ion-input type="email" placeholder="Email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="text" placeholder="Nombre y Apellido"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="text" placeholder="Usuario"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="password" placeholder="Contraseña"></ion-input>
      <ion-icon slot="end" name="eye-off-outline"></ion-icon>
    </ion-item>

    <ion-item>
      <ion-input type="password" placeholder="Confirmar Contraseña"></ion-input>
      <ion-icon slot="end" name="eye-off-outline"></ion-icon>
    </ion-item>

    <ion-button expand="block" color="primary" class="create-button">Crear Cuenta</ion-button>
  </div>
</ion-content>
